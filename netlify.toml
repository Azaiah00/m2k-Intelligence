[build]
  publish = "."
  command = "echo 'No build step needed'"

## Netlify Functions
[functions]
  directory = "netlify/functions"

## API routes -> Netlify Functions (MUST come before catch-all)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

## Catch-all for SPA routing (must come last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

# Environment variables (set these in Netlify dashboard)
# GEMINI_API_KEY = your_api_key_here
